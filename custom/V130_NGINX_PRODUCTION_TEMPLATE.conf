# 柚喜饰界 v1.30 nginx 生产模板
# 使用前必须替换 <SSL_CERTIFICATE_PATH>、<SSL_CERTIFICATE_KEY_PATH>、<WEB_ROOT>。
# 本文件未写入任何真实服务器。

server {
    listen 80;
    listen [::]:80;
    server_name zhengmu.cn www.zhengmu.cn;
    return 301 https://www.zhengmu.cn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zhengmu.cn;

    ssl_certificate <SSL_CERTIFICATE_PATH>;
    ssl_certificate_key <SSL_CERTIFICATE_KEY_PATH>;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.zhengmu.cn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.zhengmu.cn;

    root <WEB_ROOT>;
    index index.html;

    ssl_certificate <SSL_CERTIFICATE_PATH>;
    ssl_certificate_key <SSL_CERTIFICATE_KEY_PATH>;
    ssl_protocols TLSv1.2 TLSv1.3;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /404.html {
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(?:css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, must-revalidate";
    }

    location ~* \.(?:avif|gif|jpe?g|png|svg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # OPTIONAL_POST_TLS_VALIDATION：确认全站 HTTPS 稳定后再考虑 HSTS；不要直接启用 preload。
    # add_header Strict-Transport-Security "max-age=86400" always;

    # CSP 必须完成所有资源审计后另行设计，本模板不默认启用可能破坏页面的严格策略。
}
