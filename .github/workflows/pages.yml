name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets/images
          cp index.html styles.css script.js 404.html robots.txt sitemap.xml .nojekyll _site/
          cp assets/favicon.svg assets/logo-yuxi-horizontal.svg assets/logo-yuxi-mark.svg _site/assets/
          cp assets/logo-yuxi-mark-dark.svg assets/logo-yuxi-mark-mono.svg _site/assets/
          cp assets/wecom-qr.jpg assets/official-account-qr.jpg assets/qr-placeholder.svg _site/assets/
          cp assets/images/hero-teak-lifestyle.jpg assets/images/knowledge-outdoor-wood.jpg _site/assets/images/
          cp assets/images/knowledge-teak-grain.jpg assets/images/knowledge-teak-maintenance.jpg _site/assets/images/
          cp assets/images/product-teak-chair.jpg assets/images/product-teak-table.jpg _site/assets/images/
          cp assets/images/vendor-craft-sample.jpg assets/images/vendor-showroom-sample.jpg _site/assets/images/
          cp assets/images/vendor-workshop-sample.jpg assets/images/wechat-section-bg.jpg _site/assets/images/
          cp -R data knowledge solutions vendors cases articles forms about cooperation _site/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
